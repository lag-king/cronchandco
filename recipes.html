<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Recipes — Cronch & Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--red:#C8493A;--cream:#FAF7F2;--text:#1a1108;--muted:#7a6a5a;--border:#e2d8cf}
html,body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;overflow-x:hidden}

.app-header{background:var(--red);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(200,73,58,0.28)}
.hdr-back{background:rgba(255,255,255,0.18);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}
.hdr-logo{font-family:'Playfair Display',serif;color:#fff;font-size:17px;font-weight:900;line-height:1.1;text-align:right}
.hdr-logo span{display:block;font-size:13px}

.page{padding:32px 24px 60px;display:flex;flex-direction:column;align-items:center;gap:12px}

.combo-card{width:100%;max-width:380px;background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:20px;cursor:pointer;user-select:none;-webkit-user-select:none}
.combo-card:active{background:#fdf9f7}
.combo-split{display:flex;align-items:center}
.combo-left{flex:1;text-align:center}
.combo-main{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:var(--text);line-height:1.3}
.combo-plus{font-size:20px;font-weight:300;color:var(--muted);flex-shrink:0;padding:0 12px}
.combo-right{flex:1;text-align:center}
.combo-val{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--red);transition:opacity 0.3s ease,transform 0.3s ease;display:block;line-height:1.2}
.combo-val.out{opacity:0;transform:translateY(8px)}
.combo-hint{font-size:10px;color:var(--muted);margin-top:12px;font-weight:300;text-align:center}
.combo-footer{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;display:flex;align-items:center;justify-content:space-between}
.counter{font-size:11px;color:var(--muted);font-weight:300;letter-spacing:1px}
.combo-nav{display:flex;gap:8px}
.nav-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--muted);-webkit-appearance:none}
.nav-btn:active{background:var(--red);color:#fff;border-color:var(--red)}

.cta{display:inline-flex;align-items:center;justify-content:center;width:100%;max-width:380px;background:var(--red);color:#fff;text-decoration:none;padding:15px;border-radius:14px;font-size:15px;font-weight:500;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(200,73,58,0.3);margin-top:8px}
.idea-card{width:100%;max-width:380px;background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:20px}
.idea-label{font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.idea-input{width:100%;background:var(--cream);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--text);outline:none;resize:none;height:72px;line-height:1.5}
.idea-input:focus{border-color:var(--red)}
.idea-row{display:flex;gap:8px;margin-top:10px}
.idea-name{flex:1;background:var(--cream);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--text);outline:none}
.idea-name:focus{border-color:var(--red)}
.idea-btn{background:var(--red);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;-webkit-appearance:none}
.idea-btn:active{background:var(--red-dark)}
.idea-sent{display:none;font-size:13px;color:var(--muted);text-align:center;margin-top:10px;font-weight:300}
.coming-soon{width:100%;max-width:380px;background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:20px;text-align:center}
.cs-tag{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.cs-text{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.cs-sub{font-size:12px;color:var(--muted);font-weight:300;line-height:1.6}
</style>
</head>
<body>

<div class="app-header">
  <a class="hdr-back" href="/">←</a>
  <div class="hdr-logo">cronch<span>and co.</span></div>
</div>

<div class="page">

  <div class="combo-card" id="combo-card">
    <div class="combo-split">
      <div class="combo-left">
        <div class="combo-main">naadan chilli crisp</div>
      </div>
      <div class="combo-plus">+</div>
      <div class="combo-right">
        <span class="combo-val" id="combo-text">dosa</span>
      </div>
    </div>
    <div class="combo-hint">tap card or use arrows</div>
    <div class="combo-footer">
      <div class="counter" id="counter">1 of 16</div>
      <div class="combo-nav">
        <button class="nav-btn" id="btn-prev">←</button>
        <button class="nav-btn" id="btn-next">→</button>
      </div>
    </div>
  </div>

  <div class="idea-card">
    <div class="idea-label">suggest a combination</div>
    <textarea class="idea-input" id="idea-text" placeholder="e.g. maggi noodles, butter chicken..."></textarea>
    <div class="idea-row">
      <input class="idea-name" id="idea-name" type="text" placeholder="your name (optional)">
      <button class="idea-btn" id="idea-submit">send</button>
    </div>
    <div class="idea-sent" id="idea-sent">thanks! we'll add it to the list 🌶️</div>
  </div>

  <div class="coming-soon">
    <div class="cs-tag">coming soon</div>
    <div class="cs-text">full recipes dropping soon</div>
    <div class="cs-sub">step-by-step ways to use naadan chilli crisp — from quick weeknight dinners to weekend specials.</div>
  </div>

  <a class="cta" href="/">order now</a>

</div>

<script>
const COMBOS = [
  'dosa',
  'idly',
  'kanji',
  'kappa',
  'fried rice',
  'prawns',
  'ice cream',
  'potato chips',
  'tapioca chips',
  'banana chips',
  'boiled egg',
  'avocado toast',
  'sunny side up',
  'omelette',
  'toast',
  'chapathi',
];

const el      = document.getElementById('combo-text');
const counter = document.getElementById('counter');
const card    = document.getElementById('combo-card');
let idx = 0;
let timer;

function show(i){
  el.classList.add('out');
  setTimeout(() => {
    idx = (i + COMBOS.length) % COMBOS.length;
    el.textContent = COMBOS[idx];
    el.classList.remove('out');
    counter.textContent = `${idx + 1} of ${COMBOS.length}`;
  }, 300);
}

function next(){ show(idx + 1); resetTimer(); }
function prev(){ show(idx - 1); resetTimer(); }
function resetTimer(){ clearInterval(timer); timer = setInterval(next, 4000); }

card.addEventListener('click', function(e){ if(!e.target.closest('.nav-btn')) next(); });
document.getElementById('btn-next').addEventListener('click', e => { e.stopPropagation(); next(); });
document.getElementById('btn-prev').addEventListener('click', e => { e.stopPropagation(); prev(); });

let startX = 0;
card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
card.addEventListener('touchend', e => {
  const diff = startX - e.changedTouches[0].clientX;
  if(Math.abs(diff) > 40){ diff > 0 ? next() : prev(); }
}, {passive:true});

counter.textContent = `1 of ${COMBOS.length}`;
resetTimer();

// idea submission — sends via WhatsApp for now
document.getElementById('idea-submit').addEventListener('click', function(){
  const idea = document.getElementById('idea-text').value.trim();
  const name = document.getElementById('idea-name').value.trim();
  if(!idea){ document.getElementById('idea-text').focus(); return; }
  const msg = `Combo idea for Cronch & Co.${name ? ' from ' + name : ''}:\n${idea}`;
  window.open(`https://wa.me/919175975530?text=${encodeURIComponent(msg)}`);
  document.getElementById('idea-text').value = '';
  document.getElementById('idea-name').value = '';
  document.getElementById('idea-sent').style.display = 'block';
});
</script>
</body>
</html>
